services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathproof
      POSTGRES_PASSWORD: pathproof_dev
      POSTGRES_DB: pathproof
    ports:
      - "5432:5432"
    volumes:
      - pathproof-pgdata:/var/lib/postgresql/data

volumes:
  pathproof-pgdata:
